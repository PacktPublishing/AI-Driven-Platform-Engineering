apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: agent-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      automountServiceAccountToken: false
      containers:
      - name: keycloak
        image: quay.io/keycloak/keycloak:26.7.4
        imagePullPolicy: IfNotPresent
        args: ["start-dev", "--import-realm"]
        env:
        - name: KC_HOSTNAME
          value: http://localhost:18083
        - name: KC_HTTP_ENABLED
          value: "true"
        - name: KC_HEALTH_ENABLED
          value: "true"
        ports:
        - name: http
          containerPort: 8080
        readinessProbe:
          httpGet:
            path: /realms/platform
            port: http
          periodSeconds: 5
          failureThreshold: 60
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        volumeMounts:
        - name: realm-import
          mountPath: /opt/keycloak/data/import
          readOnly: true
      volumes:
      - name: realm-import
        secret:
          secretName: keycloak-realm-import
